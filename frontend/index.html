<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F150E" />
    <title>Curtain — Theatrical Operations Platform</title>
    <meta name="description" content="The complete operations platform for theatrical companies." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      VLibras (Governo Federal): tradução do conteúdo para Libras por avatar.
      Fica fora do #root para ser carregado uma única vez e continuar na tela
      em todas as rotas, inclusive login e páginas públicas. O script é
      assíncrono para não atrasar a abertura do sistema; o avatar só é baixado
      quando a pessoa clica no botão.
    -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script
      src="https://vlibras.gov.br/app/vlibras-plugin.js"
      async
      onload="if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app')"
    ></script>
  </body>
</html>
